[project]
name = "mlops-practitioner"
version = "0.1.0"
description = "Production ML service for NYC taxi trip duration prediction"
authors = [
    { name = "Hussein Waleed", email = "hussienwaleed998@gmail.com" }
]
requires-python = ">=3.12.13"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.9",
    "httpx>=0.27",
    "pre-commit>=3.7",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[project.scripts]
mlops-practitioner = "mlops_practitioner:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/prodml"]

[tool.pytest.ini_options]
addopts = "--cov=src/prodml --cov-fail-under=70"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]
